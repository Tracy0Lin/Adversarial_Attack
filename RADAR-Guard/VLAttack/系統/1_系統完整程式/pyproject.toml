[tool.poetry]
name = "vlattack-web"
version = "0.1.0"
description = "MLLM adversarial attack verification web (Flask + TC-VAD pipeline)"
readme = "README.md"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
flask = "^3.0"
numpy = "^1.26"
pillow = "^10.0"
scikit-image = "^0.22"
torch = "^2.2"
torchvision = "^0.17"
lpips = "^0.1.4"
salesforce-lavis = "^1.0.2"
clip = { git = "https://github.com/openai/CLIP.git" }
scikit-learn = ">=1.4,<1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
